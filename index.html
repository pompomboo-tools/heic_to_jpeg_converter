<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="./favicon.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="./apple-touch-icon.png" sizes="180x180">
<title>HEIC → JPEG 変換</title>
<!-- HEIC変換用のライブラリ -->
<script src="https://cdn.jsdelivr.net/npm/heic2any@0.0.4/dist/heic2any.min.js"></script>
<style>
  :root {
    --ios-blue:#007aff; --ios-blue-pressed:#0062cc; --ios-red:#ff3b30;
    --bg:#f2f2f7; --card:#ffffff; --text:#1c1c1e; --text-secondary:#636366;
    --separator:#d1d1d6; --fill:#f2f2f7; --radius:16px; --control-radius:11px;
    --shadow:0 6px 20px rgba(0,0,0,.06),0 1px 3px rgba(0,0,0,.04);
  }
  *{box-sizing:border-box}
  html{background:var(--bg);-webkit-text-size-adjust:100%}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans","Yu Gothic UI",Meiryo,sans-serif;background:var(--bg);color:var(--text);margin:0 auto;width:100%;max-width:820px;min-height:100vh;padding:max(22px,env(safe-area-inset-top)) 20px max(28px,env(safe-area-inset-bottom));overflow-x:hidden;-webkit-font-smoothing:antialiased;display:flex;flex-direction:column}
  .panel{background:var(--card);padding:22px;border-radius:var(--radius);box-shadow:var(--shadow);order:1}
  .dropzone{border:1.5px dashed #aeb4bd;min-height:150px;padding:34px 22px;display:flex;flex-direction:column;justify-content:center;text-align:center;cursor:pointer;background:#f9f9fb;margin:0 0 18px;border-radius:14px;color:var(--text-secondary);line-height:1.55;transition:transform .1s ease,background-color .15s ease,border-color .15s ease}
  .dropzone:hover,.dropzone:focus-visible{background:#f3f8ff;border-color:var(--ios-blue)}
  .dropzone.dragover{background:#edf6ff;border-color:var(--ios-blue);transform:scale(.995)}
  .dropzone *{pointer-events:none}
  .dropzone span[style]{color:var(--ios-blue)!important;text-decoration:none!important;font-weight:600}
  input[type="file"]{display:none}
  ul{list-style:none;padding:0;margin:14px 0;max-height:400px;overflow-y:auto}
  li{padding:11px 12px;background:#f9f9fb;border:1px solid #e5e5ea;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;gap:10px;border-radius:12px;min-width:0}
  li>span.filename{flex:1 1 auto;min-width:0;overflow-wrap:anywhere;margin-right:4px;line-height:1.45;font-weight:600}
  li>div.controls{flex:0 0 auto;display:flex;align-items:center;gap:10px}
  .status{font-size:13px;color:var(--text-secondary);font-weight:600;min-width:68px;text-align:right}
  .action-row{display:grid;grid-template-columns:1fr 3fr;gap:10px;align-items:stretch;margin-top:16px}
  button{font:inherit;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
  button.action{min-height:50px;padding:11px 18px;background:var(--ios-blue);color:#fff;border:0;border-radius:13px;cursor:pointer;font-size:16px;font-weight:700;width:100%;transition:transform .08s ease,background-color .15s ease,opacity .15s ease,box-shadow .15s ease}
  button.action:disabled{background:#c7c7cc;color:#fff;cursor:not-allowed;opacity:.72}
  .clear-btn{min-height:50px;padding:11px 10px;background:transparent;color:var(--text-secondary);border:1px solid var(--separator);border-radius:13px;cursor:pointer;font-size:15px;font-weight:500;transition:transform .08s ease,background-color .15s ease,border-color .15s ease,color .15s ease}
  button.del{min-width:40px;min-height:40px;padding:6px 10px;cursor:pointer;border:0;background:var(--ios-red);color:#fff;border-radius:10px;font-weight:700;transition:transform .08s ease,background-color .15s ease,opacity .15s ease}
  button.del:disabled{background:#c7c7cc;cursor:not-allowed;opacity:.72}
  #main-msg{min-height:20px;line-height:1.45;overflow-wrap:anywhere}
  button:focus-visible,.dropzone:focus-visible{outline:3px solid rgba(0,122,255,.28);outline-offset:2px}
  button:not(:disabled):active,.dropzone:active{transform:scale(.98)}

  /* インフォメーションボタン：PCは作業領域下の右下、スマホは作業領域上の右上 */
  .info-footer{display:flex;justify-content:flex-end;align-items:center;order:2;margin-top:12px}
  .info-button{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:var(--control-radius);background:#fff;color:var(--text-secondary);border:1px solid var(--separator);padding:0;cursor:pointer;outline:none;font-family:Georgia,"Times New Roman",serif;font-size:20px;font-weight:400;font-style:normal;line-height:1;-webkit-tap-highlight-color:transparent;transition:transform .08s ease,background-color .15s ease,border-color .15s ease,color .15s ease}
  .modal-overlay{position:fixed;inset:0;width:100vw;height:100vh;background:rgba(0,0,0,.4);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);display:flex;justify-content:center;align-items:center;z-index:9999;opacity:0;visibility:hidden;transition:opacity .25s ease,visibility .25s ease;padding:20px}
  .modal-overlay.active{opacity:1;visibility:visible}
  .modal-content{position:relative;background:#fff;border-radius:20px;max-width:90vw;max-height:85vh;box-shadow:0 20px 40px rgba(0,0,0,.25);overflow:hidden;display:flex;flex-direction:column;transform:scale(.92);transition:transform .25s cubic-bezier(.175,.885,.32,1.275)}
  .modal-overlay.active .modal-content{transform:scale(1)}
  .modal-close-btn{position:absolute;top:12px;right:12px;width:30px;height:30px;border-radius:50%;background:rgba(118,118,128,.12);color:var(--text-secondary);border:0;display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:10;padding:0;transition:background .15s ease,transform .15s ease;-webkit-tap-highlight-color:transparent}
  .modal-close-btn:active{transform:scale(.9);background:rgba(118,118,128,.25)}
  .modal-close-btn svg{width:16px;height:16px;stroke:currentColor;stroke-width:2.5;stroke-linecap:round}
  .modal-body{padding:16px;overflow-y:auto;display:flex;justify-content:center;align-items:center}
  .modal-body img{max-width:100%;height:auto;border-radius:12px;display:block}
  @media(hover:hover) and (pointer:fine){
    button.action:hover:not(:disabled){background:var(--ios-blue-pressed)}
    button.action:disabled:hover{background:#b8b8bd;opacity:.9;box-shadow:0 0 0 3px rgba(0,122,255,.12)}
    .clear-btn:hover{background:rgba(118,118,128,.08);border-color:#c7c7cc;color:var(--text)}
    button.del:hover:not(:disabled){background:#e23229}
    button.del:disabled:hover{background:#b8b8bd;opacity:.9}
    .info-button:hover{background:rgba(118,118,128,.08);border-color:#c7c7cc;color:var(--text)}
  }
  @media(max-width:580px){
    body{padding:max(10px,env(safe-area-inset-top)) max(8px,env(safe-area-inset-right)) max(10px,env(safe-area-inset-bottom)) max(8px,env(safe-area-inset-left))}
    .info-footer{order:1;margin-top:0;margin-bottom:8px}
    .panel{order:2}
    .panel{padding:14px;border-radius:15px}
    .dropzone{min-height:128px;padding:25px 14px}
    li{align-items:flex-start;flex-direction:column}
    li>div.controls{width:100%;justify-content:flex-end}
    button.del{min-width:44px;min-height:44px}
    .action-row{grid-template-columns:1fr 3fr;gap:8px}
    .clear-btn,button.action{min-height:48px}
  }
  @media(max-width:350px){.panel{padding:11px}.action-row{gap:6px}}
  @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>



<div class="panel">
  <div class="dropzone" id="drop-area" tabindex="0" role="button" onclick="document.getElementById('file-input').click()">
    ここにHEICファイルをドラッグ＆ドロップ<br><br>
    <span style="color:#3498db; text-decoration:underline;">またはクリックしてファイルを選択</span>
  </div>
  <input type="file" id="file-input" multiple accept=".heic, .heif">

  <ul id="file-list"></ul>

  <div class="action-row">
    <button type="button" class="clear-btn" onclick="clearSettings()">クリア</button>
    <button class="action" onclick="doConvert()" id="btn-convert" disabled>変換してダウンロード</button>
  </div>
  <div id="main-msg" style="margin-top: 15px; font-weight: bold; text-align: center; color: #2980b9;"></div>
</div>




<div class="info-footer">
  <button type="button" class="info-button" id="infoButton" aria-label="インフォメーション" aria-haspopup="dialog" aria-controls="infoModal">i</button>
</div>
<div class="modal-overlay" id="infoModal" role="dialog" aria-modal="true" aria-hidden="true" aria-label="インフォメーション">
  <div class="modal-content">
    <button type="button" class="modal-close-btn" id="modalCloseBtn" aria-label="閉じる">
      <svg viewBox="0 0 24 24" aria-hidden="true"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
    </button>
    <div class="modal-body"><img src="pompomboo-tools.png" alt="Pompomboo Tools"></div>
  </div>
</div>
<script>

// ================= インフォメーションモーダル =================
const infoButton = document.getElementById('infoButton');
const infoModal = document.getElementById('infoModal');
const modalCloseBtn = document.getElementById('modalCloseBtn');
let infoLastFocusedElement = null;
function openInfoModal(){
  infoLastFocusedElement = document.activeElement;
  infoModal.classList.add('active');
  infoModal.setAttribute('aria-hidden','false');
  modalCloseBtn.focus();
}
function closeInfoModal(){
  infoModal.classList.remove('active');
  infoModal.setAttribute('aria-hidden','true');
  if(infoLastFocusedElement) infoLastFocusedElement.focus();
}
infoButton.addEventListener('click',openInfoModal);
modalCloseBtn.addEventListener('click',closeInfoModal);
infoModal.addEventListener('click',e=>{if(e.target===infoModal)closeInfoModal();});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&infoModal.classList.contains('active'))closeInfoModal();});
let filesToConvert = [];

// ================= クリア処理 =================
function clearSettings() {
  if(!confirm('追加した画像と変換状況をクリアしますか？')) return;

  // ファイルデータを空にする
  filesToConvert = [];
  renderList();

  // メッセージとボタンのテキストを初期状態に戻す
  document.getElementById('main-msg').innerText = '';
  const btnConvert = document.getElementById('btn-convert');
  btnConvert.innerText = '変換してダウンロード';
  btnConvert.disabled = true;
}

// --- ドラッグ＆ドロップの設定 ---
const dropArea = document.getElementById('drop-area');
const fileInput = document.getElementById('file-input');
dropArea.addEventListener('keydown', e => {
  if (e.key === 'Enter' || e.key === ' ') {
    e.preventDefault();
    dropArea.click();
  }
});

window.addEventListener('dragover', e => e.preventDefault());
window.addEventListener('drop', e => e.preventDefault());

['dragenter', 'dragover'].forEach(ev => dropArea.addEventListener(ev, e => {
  e.preventDefault(); dropArea.classList.add('dragover');
}));
['dragleave', 'drop'].forEach(ev => dropArea.addEventListener(ev, e => {
  e.preventDefault(); dropArea.classList.remove('dragover');
}));

dropArea.addEventListener('drop', e => {
  const files = Array.from(e.dataTransfer.files).filter(f => f.name.toLowerCase().match(/\.hei[cf]$/));
  if(files.length > 0) addFiles(files);
});

fileInput.addEventListener('change', e => {
  if(fileInput.files.length > 0) addFiles(Array.from(fileInput.files));
  fileInput.value = ''; // 連続選択のためにリセット
});

// --- ファイル追加とリスト描画 ---
function addFiles(files) {
  filesToConvert.push(...files);
  renderList();
}

function renderList() {
  const ul = document.getElementById('file-list');
  ul.innerHTML = '';
  filesToConvert.forEach((f, i) => {
    ul.innerHTML += `<li>
      <span class="filename">${f.name}</span>
      <div class="controls">
        <span class="status" id="status-${i}">待機中</span>
        <button class="del" id="del-${i}" onclick="delFile(${i})">✕</button>
      </div>
    </li>`;
  });
  document.getElementById('btn-convert').disabled = filesToConvert.length === 0;
}

function delFile(index) {
  filesToConvert.splice(index, 1);
  renderList();
}

// --- ダウンロード処理 ---
function download(blob, filename) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  a.click();
  setTimeout(() => URL.revokeObjectURL(url), 1000); // メモリ解放
}

// --- 変換処理メイン ---
async function doConvert() {
  const btn = document.getElementById('btn-convert');
  const mainMsg = document.getElementById('main-msg');

  btn.disabled = true;
  mainMsg.innerText = '順番に変換しています。しばらくお待ちください...';
  mainMsg.style.color = '#2980b9'; // メッセージの色をリセット

  // 変換中は削除ボタンを押せないようにする
  document.querySelectorAll('.del').forEach(b => b.disabled = true);

  let successCount = 0;

  // メモリ負荷を考慮して、1枚ずつ順番に処理する
  for (let i = 0; i < filesToConvert.length; i++) {
    const file = filesToConvert[i];
    const statusEl = document.getElementById(`status-${i}`);

    statusEl.innerText = '変換中...';
    statusEl.style.color = '#e67e22';

    try {
      // heic2anyライブラリを使ってJPEGに変換 (品質0.9)
      let resultBlob = await heic2any({
        blob: file,
        toType: "image/jpeg",
        quality: 0.9
      });

      // アニメーションHEICなどの場合、配列で返ってくることがあるので最初の1枚を取得
      if (Array.isArray(resultBlob)) {
        resultBlob = resultBlob[0];
      }

      // 拡張子を .jpg に書き換えてダウンロード
      const newName = file.name.replace(/\.hei[cf]$/i, '.jpg');
      download(resultBlob, newName);

      statusEl.innerText = '完了';
      statusEl.style.color = '#27ae60';
      successCount++;

    } catch (err) {
      console.error(err);
      statusEl.innerText = 'エラー';
      statusEl.style.color = '#c0392b';
    }
  }

  mainMsg.innerText = `処理が完了しました！ (${successCount}/${filesToConvert.length}枚 成功)`;
  mainMsg.style.color = '#27ae60';

  btn.innerText = "変換完了";
}
</script>
</body>
</html>
