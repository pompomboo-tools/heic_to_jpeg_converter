<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>HEIC → JPEG 変換</title>
<!-- HEIC変換用のライブラリ -->
<script src="https://cdn.jsdelivr.net/npm/heic2any@0.0.4/dist/heic2any.min.js"></script>
<style>
  body { font-family: sans-serif; background: #f4f7f6; padding: 20px; max-width: 800px; margin: auto; color: #333; display: flex; flex-direction: column; min-height: 95vh; box-sizing: border-box; }

  /* ヘッダーとクリアボタンのスタイルを追加 */
  .header-container { display: flex; justify-content: center; align-items: center; position: relative; margin-bottom: 30px; margin-top: 10px; }
  .header-container h2 { margin: 0; }
  .clear-btn { position: absolute; right: 0; padding: 8px 15px; background: #ddd; color: #333; border: none; border-radius: 5px; cursor: pointer; font-size: 15px; font-family: inherit; transition: 0.2s; }
  .clear-btn:hover { background: #ccc; }

  .panel { background: #fff; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }

  .dropzone { border: 2px dashed #aaa; padding: 40px; text-align: center; cursor: pointer; background: #fafafa; margin: 15px 0; border-radius: 8px; transition: 0.2s; line-height: 1.5; }
  .dropzone:hover { background: #eef5fa; border-color: #3498db; }
  .dropzone.dragover { background: #e0f7fa; border-color: #00bcd4; transform: scale(1.02); }
  .dropzone * { pointer-events: none; }

  input[type="file"] { display: none; }
  ul { list-style: none; padding: 0; max-height: 400px; overflow-y: auto; }

  li { padding: 10px 15px; background: #f9f9f9; border: 1px solid #ddd; margin-bottom: 5px; display: flex; justify-content: space-between; align-items: center; border-radius: 4px; }
  li > span.filename { flex-grow: 1; word-break: break-all; margin-right: 15px; line-height: 1.4; font-weight: bold; }
  li > div.controls { flex-shrink: 0; display: flex; align-items: center; gap: 15px; }

  .status { font-size: 14px; color: #777; font-weight: bold; min-width: 80px; text-align: right; }

  button.action { padding: 12px 20px; background: #27ae60; color: #fff; border: none; border-radius: 5px; cursor: pointer; font-size: 16px; margin-top: 15px; width: 100%; transition: 0.2s; font-weight: bold;}
  button.action:hover { background: #219150; }
  button.action:disabled { background: #aaa; cursor: not-allowed; }

  button.del { padding: 6px 12px; cursor: pointer; border: none; background: #e74c3c; color: #fff; border-radius: 3px; font-weight: bold; }
  button.del:hover { background: #c0392b; }
  button.del:disabled { background: #ccc; cursor: not-allowed; }
</style>
</head>
<body>

<div class="header-container">
  <h2>🍏 HEIC → JPEG 変換</h2>
  <button class="clear-btn" onclick="clearSettings()">クリア</button>
</div>

<div class="panel">
  <div class="dropzone" id="drop-area" onclick="document.getElementById('file-input').click()">
    📥 ここにHEIC画像をドラッグ＆ドロップ<br><br>
    <span style="color:#3498db; text-decoration:underline;">またはクリックしてファイルを選択</span>
  </div>
  <input type="file" id="file-input" multiple accept=".heic, .heif">

  <ul id="file-list"></ul>

  <button class="action" onclick="doConvert()" id="btn-convert" disabled>一括変換してダウンロード</button>
  <div id="main-msg" style="margin-top: 15px; font-weight: bold; text-align: center; color: #2980b9;"></div>
</div>

<script>
let filesToConvert = [];

// ================= クリア処理 =================
function clearSettings() {
  if(!confirm('追加した画像と変換状況をクリアしますか？')) return;

  // ファイルデータを空にする
  filesToConvert = [];
  renderList();

  // メッセージとボタンのテキストを初期状態に戻す
  document.getElementById('main-msg').innerText = '';
  const btnConvert = document.getElementById('btn-convert');
  btnConvert.innerText = '一括変換してダウンロード';
  btnConvert.disabled = true;
}

// --- ドラッグ＆ドロップの設定 ---
const dropArea = document.getElementById('drop-area');
const fileInput = document.getElementById('file-input');

window.addEventListener('dragover', e => e.preventDefault());
window.addEventListener('drop', e => e.preventDefault());

['dragenter', 'dragover'].forEach(ev => dropArea.addEventListener(ev, e => {
  e.preventDefault(); dropArea.classList.add('dragover');
}));
['dragleave', 'drop'].forEach(ev => dropArea.addEventListener(ev, e => {
  e.preventDefault(); dropArea.classList.remove('dragover');
}));

dropArea.addEventListener('drop', e => {
  const files = Array.from(e.dataTransfer.files).filter(f => f.name.toLowerCase().match(/\.hei[cf]$/));
  if(files.length > 0) addFiles(files);
});

fileInput.addEventListener('change', e => {
  if(fileInput.files.length > 0) addFiles(Array.from(fileInput.files));
  fileInput.value = ''; // 連続選択のためにリセット
});

// --- ファイル追加とリスト描画 ---
function addFiles(files) {
  filesToConvert.push(...files);
  renderList();
}

function renderList() {
  const ul = document.getElementById('file-list');
  ul.innerHTML = '';
  filesToConvert.forEach((f, i) => {
    ul.innerHTML += `<li>
      <span class="filename">${f.name}</span>
      <div class="controls">
        <span class="status" id="status-${i}">待機中</span>
        <button class="del" id="del-${i}" onclick="delFile(${i})">✕</button>
      </div>
    </li>`;
  });
  document.getElementById('btn-convert').disabled = filesToConvert.length === 0;
}

function delFile(index) {
  filesToConvert.splice(index, 1);
  renderList();
}

// --- ダウンロード処理 ---
function download(blob, filename) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  a.click();
  setTimeout(() => URL.revokeObjectURL(url), 1000); // メモリ解放
}

// --- 変換処理メイン ---
async function doConvert() {
  const btn = document.getElementById('btn-convert');
  const mainMsg = document.getElementById('main-msg');

  btn.disabled = true;
  mainMsg.innerText = '⏳ 順番に変換しています。しばらくお待ちください...';
  mainMsg.style.color = '#2980b9'; // メッセージの色をリセット

  // 変換中は削除ボタンを押せないようにする
  document.querySelectorAll('.del').forEach(b => b.disabled = true);

  let successCount = 0;

  // メモリ負荷を考慮して、1枚ずつ順番に処理する
  for (let i = 0; i < filesToConvert.length; i++) {
    const file = filesToConvert[i];
    const statusEl = document.getElementById(`status-${i}`);

    statusEl.innerText = '⚙️ 変換中...';
    statusEl.style.color = '#e67e22';

    try {
      // heic2anyライブラリを使ってJPEGに変換 (品質0.9)
      let resultBlob = await heic2any({
        blob: file,
        toType: "image/jpeg",
        quality: 0.9
      });

      // アニメーションHEICなどの場合、配列で返ってくることがあるので最初の1枚を取得
      if (Array.isArray(resultBlob)) {
        resultBlob = resultBlob[0];
      }

      // 拡張子を .jpg に書き換えてダウンロード
      const newName = file.name.replace(/\.hei[cf]$/i, '.jpg');
      download(resultBlob, newName);

      statusEl.innerText = '✅ 完了';
      statusEl.style.color = '#27ae60';
      successCount++;

    } catch (err) {
      console.error(err);
      statusEl.innerText = '❌ エラー';
      statusEl.style.color = '#c0392b';
    }
  }

  mainMsg.innerText = `🎉 処理が完了しました！ (${successCount}/${filesToConvert.length}枚 成功)`;
  mainMsg.style.color = '#27ae60';

  btn.innerText = "変換完了";
}
</script>
</body>
</html>
